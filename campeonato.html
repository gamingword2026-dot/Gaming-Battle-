<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscrição Campeonato</title>

<link rel="stylesheet" href="campeonato.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="overlay"></div>

<div class="container">

<img src="txtgaming.png" class="logo" alt="Gaming World">

<div class="card">

<h1>Inscrição Campeonato</h1>

<p>Preencha os dados abaixo para participar.</p>

<form onsubmit="enviarWhatsApp(); return false;">

<input
type="text"
id="cla"
placeholder="Nome do Clã"
required>

<input
type="text"
id="nick"
placeholder="Nick do Jogador"
required>

<input
type="text"
id="id"
placeholder="ID do Jogador"
required>
>

<p class="aviso">
📎 Após abrir o WhatsApp, envie o logotipo da equipe como a próxima mensagem.
</p>

<button type="submit">
Enviar Inscrição
</button>

</form>

</div>

</div>

<script>

function enviarWhatsApp(){

const cla=document.getElementById("cla").value.trim();
const nick=document.getElementById("nick").value.trim();
const id=document.getElementById("id").value.trim();

const mensagem=
`🏆 INSCRIÇÃO CAMPEONATO - GAMING WORLD

🏷️ Clã: ${cla}

🎮 Nick: ${nick}

🆔 ID: ${id}

📎 O logotipo da equipe será enviado logo abaixo desta mensagem.`;

const numero="5531971497142";

const url="https://wa.me/"+numero+"?text="+encodeURIComponent(mensagem);

window.open(url,"_blank");

}

</script>

</body>
</html>
