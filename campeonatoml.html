<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming World - Campeonato</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #fff;
            position: relative;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(255, 100, 0, 0.04) 0%, transparent 60%), linear-gradient(180deg, #0a0a0a 0%, #111 50%, #0a0a0a 100%);
            z-index: 0;
        }

        .bg-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('fundogaming.png') no-repeat center center/cover;
            opacity: 0.08;
            z-index: 0;
        }

        .header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.7) 80%, transparent 100%);
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5px;
        }

        .logo-principal {
            max-width: 280px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.15));
            transition: transform 0.3s ease;
        }

        .logo-principal:hover {
            transform: scale(1.02);
        }

        .titulo-principal {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 4s linear infinite;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        @keyframes shineText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitulo {
            font-size: 1.1rem;
            color: #ffd700;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 4px;
            opacity: 0.9;
        }

        .nav-topo {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-nav {
            padding: 10px 35px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid rgba(255, 215, 0, 0.25);
            background: rgba(0, 0, 0, 0.5);
            color: #ffd700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            backdrop-filter: blur(5px);
        }

        .btn-nav:hover {
            background: #ffd700;
            color: #0a0a0a;
            border-color: #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            transform: translateY(-2px) scale(1.03);
        }

        .nav-rodadas {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 18px 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 215, 0, 0.08);
            border-bottom: 1px solid rgba(255, 215, 0, 0.08);
        }

        .btn-rodada {
            padding: 10px 30px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 2px solid rgba(255, 215, 0, 0.2);
            background: transparent;
            color: #aaa;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
        }

        .btn-rodada:hover {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.4);
            transform: scale(1.05);
        }

        .btn-rodada.ativo {
            background: #ffd700;
            color: #0a0a0a;
            border-color: #ffd700;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.2);
        }

        .container-confrantos {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 35px auto 40px;
            padding: 0 20px;
            min-height: 300px;
        }

        .grid-jogos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-jogo {
            background: rgba(18, 18, 35, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.08);
            border-radius: 18px;
            padding: 22px 18px;
            cursor: pointer;
            transition: all 0.35s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .card-jogo:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(255, 215, 0, 0.05);
            background: rgba(25, 25, 45, 0.95);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .time-box img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.2);
            object-fit: cover;
            background: #1a1a2e;
            transition: border-color 0.3s;
        }

        .card-jogo:hover .time-box img {
            border-color: #ffd700;
        }

        .time-box span {
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            color: #ddd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vs-box {
            font-weight: 900;
            font-size: 1.2rem;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            flex-shrink: 0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.mostrar {
            display: flex;
            animation: fadeInUp 0.3s ease;
        }

        .modal-content {
            background: linear-gradient(160deg, #1a1a30, #0a0a0a);
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 40px 30px 35px;
            max-width: 480px;
            width: 92%;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .fechar-modal {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 2rem;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
            line-height: 1;
        }

        .fechar-modal:hover {
            color: #ffd700;
            transform: rotate(90deg);
        }

        #modal-titulo {
            text-align: center;
            font-size: 1.3rem;
            color: #ffd700;
            letter-spacing: 1px;
        }

        .modal-times {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin: 25px 0 20px;
        }

        .modal-time {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .modal-time img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            object-fit: cover;
            background: #1a1a2e;
        }

        .modal-time span {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .modal-vs {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
        }

        .modal-info {
            text-align: center;
            color: #999;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 215, 0, 0.08);
            padding-top: 18px;
            margin-top: 5px;
        }

        .modal-info p {
            margin: 5px 0;
        }

        .modal-info p:last-child {
            color: #ffd700;
            font-size: 0.8rem;
            margin-top: 10px;
            opacity: 0.6;
        }

        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 22px 20px 25px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid rgba(255, 215, 0, 0.05);
            color: #666;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .footer p:last-child {
            color: #ffd700;
            font-weight: 600;
            margin-top: 6px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .logo-principal { max-width: 200px; }
            .titulo-principal { font-size: 1.5rem; letter-spacing: 2px; }
            .subtitulo { font-size: 0.95rem; }
            .btn-nav { padding: 8px 20px; font-size: 0.75rem; letter-spacing: 1px; }
            .btn-rodada { padding: 8px 16px; font-size: 0.75rem; }
            .card-jogo { padding: 15px 12px; }
            .time-box img { width: 45px; height: 45px; }
            .time-box span { font-size: 0.7rem; }
            .vs-box { font-size: 1rem; }
            .modal-time img { width: 60px; height: 60px; }
            .modal-times { gap: 20px; }
            .modal-content { padding: 30px 20px; }
        }

        @media (max-width: 480px) {
            .header { padding: 20px 15px 10px; }
            .logo-principal { max-width: 160px; }
            .titulo-principal { font-size: 1.1rem; letter-spacing: 1px; }
            .subtitulo { font-size: 0.8rem; }
            .nav-topo { gap: 10px; margin-top: 15px; }
            .btn-nav { padding: 6px 14px; font-size: 0.65rem; letter-spacing: 0.5px; }
            .nav-rodadas { gap: 8px; padding: 12px 10px; }
            .btn-rodada { padding: 6px 12px; font-size: 0.6rem; letter-spacing: 0.5px; }
            .grid-jogos { grid-template-columns: 1fr; gap: 12px; }
            .card-jogo { padding: 12px 10px; }
            .time-box img { width: 38px; height: 38px; }
            .time-box span { font-size: 0.6rem; }
            .vs-box { font-size: 0.85rem; }
            .modal-time img { width: 50px; height: 50px; }
            .modal-vs { font-size: 1.2rem; }
            #modal-titulo { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="bg-overlay"></div>

<header class="header">
    <div class="logo-container">
        <img src="logogaming.png" alt="Gaming World" class="logo-principal" onerror="this.style.display='none'">
    </div>
    <h1 class="titulo-principal">CAMPEONATO GAMING BATTLE 2026</h1>
    <p class="subtitulo">"Aqui Gaming World 2026"</p>

    <nav class="nav-topo">
        <a href="index.html" class="btn-nav">INÍCIO</a>
        <a href="regrasc.html" class="btn-nav">REGRAS</a>
        <a href="inscricao.html" class="btn-nav">INSCREVA-SE</a>
    </nav>
</header>

<nav class="nav-rodadas">
    <button class="btn-rodada ativo" data-rodada="1">RODADA 1</button>
    <button class="btn-rodada" data-rodada="2">RODADA 2</button>
    <button class="btn-rodada" data-rodada="3">RODADA 3</button>
    <button class="btn-rodada" data-rodada="4">FINAL</button>
</nav>

<div id="container-confrantos" class="container-confrantos"></div>

<div id="modal-confronto" class="modal">
    <div class="modal-content">
        <span class="fechar-modal">&times;</span>
        <h2 id="modal-titulo">⚔️ CONFRONTO</h2>
        <div id="modal-times" class="modal-times"></div>
        <div id="modal-info" class="modal-info"></div>
    </div>
</div>

<footer class="footer">
    <p>© 2026 Gaming Battle - Todos os direitos reservados</p>
    <p>Aqui Gaming World 2026</p>
</footer>
    <script>
        // DADOS DOS TIMES
        const times = [
            { id: 1, nome: 'CLÃ 1', img: 'style/cla1.png' },
            { id: 2, nome: 'CLÃ 2', img: 'style/cla2.png' },
            { id: 3, nome: 'CLÃ 3', img: 'style/cla3.png' },
            { id: 4, nome: 'CLÃ 4', img: 'style/cla4.png' },
            { id: 5, nome: 'CLÃ 5', img: 'style/cla5.png' },
            { id: 6, nome: 'CLÃ 6', img: 'style/cla6.png' },
            { id: 7, nome: 'CLÃ 7', img: 'style/cla7.png' },
            { id: 8, nome: 'CLÃ 8', img: 'style/cla8.png' },
            { id: 9, nome: 'CLÃ 9', img: 'style/cla9.png' },
            { id: 10, nome: 'CLÃ 10', img: 'style/cla10.png' },
            { id: 11, nome: 'CLÃ 11', img: 'style/cla11.png' },
            { id: 12, nome: 'CLÃ 12', img: 'style/cla12.png' }
        ];

        // CONFRONTOS
        const rodadas = {
            1: [
                { timeA: 1, timeB: 2 },
                { timeA: 3, timeB: 4 },
                { timeA: 5, timeB: 6 },
                { timeA: 7, timeB: 8 },
                { timeA: 9, timeB: 10 },
                { timeA: 11, timeB: 12 }
            ],
            2: [
                { timeA: 1, timeB: 3 },
                { timeA: 5, timeB: 7 },
                { timeA: 9, timeB: 11 }
            ],
            3: [
                { timeA: 1, timeB: 5 },
                { timeA: 9, timeB: 11 }
            ],
            4: [
                { timeA: 1, timeB: 9 }
            ]
        };

        function getTime(id) {
            return times.find(t => t.id === id);
        }

        function renderizarRodada(numero) {
            const container = document.getElementById('container-confrantos');
            const confrontos = rodadas[numero];
            
            if (!confrontos || confrontos.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#888;padding:40px 0;">Nenhum confronto disponível</p>';
                return;
            }

            let html = '<div class="grid-jogos">';
            
            confrontos.forEach((conf, index) => {
                const timeA = getTime(conf.timeA);
                const timeB = getTime(conf.timeB);
                
                html += `
                    <div class="card-jogo" data-rodada="${numero}" data-jogo="${index}">
                        <div class="time-box">
                            <img src="${timeA.img}" alt="${timeA.nome}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect width=%2260%22 height=%2260%22 fill=%22%23333%22/%3E%3Ctext x=%2230%22 y=%2235%22 text-anchor=%22middle%22 fill=%22%23ffd700%22 font-size=%2212%22 font-weight=%22bold%22%3E${timeA.nome.replace('CLÃ ', '')}%3C/text%3E%3C/svg%3E'">
                            <span>${timeA.nome}</span>
                        </div>
                        <div class="vs-box">⚔️</div>
                        <div class="time-box">
                            <img src="${timeB.img}" alt="${timeB.nome}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect width=%2260%22 height=%2260%22 fill=%22%23333%22/%3E%3Ctext x=%2230%22 y=%2235%22 text-anchor=%22middle%22 fill=%22%23ffd700%22 font-size=%2212%22 font-weight=%22bold%22%3E${timeB.nome.replace('CLÃ ', '')}%3C/text%3E%3C/svg%3E'">
                            <span>${timeB.nome}</span>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;

            document.querySelectorAll('.card-jogo').forEach(card => {
                card.addEventListener('click', function() {
                    const rodada = parseInt(this.dataset.rodada);
                    const jogo = parseInt(this.dataset.jogo);
                    abrirModal(rodada, jogo);
                });
            });
        }

        function abrirModal(rodadaNum, jogoIndex) {
            const modal = document.getElementById('modal-confronto');
            const modalTimes = document.getElementById('modal-times');
            const modalInfo = document.getElementById('modal-info');
            const modalTitulo = document.getElementById('modal-titulo');
            
            const confronto = rodadas[rodadaNum][jogoIndex];
            if (!confronto) return;

            const timeA = getTime(confronto.timeA);
            const timeB = getTime(confronto.timeB);

            modalTitulo.textContent = `⚔️ RODADA ${rodadaNum} - CONFRONTO ${jogoIndex + 1}`;
            
            modalTimes.innerHTML = `
                <div class="modal-time">
                    <img src="${timeA.img}" alt="${timeA.nome}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23333%22/%3E%3Ctext x=%2240%22 y=%2245%22 text-anchor=%22middle%22 fill=%22%23ffd700%22 font-size=%2216%22 font-weight=%22bold%22%3E${timeA.nome.replace('CLÃ ', '')}%3C/text%3E%3C/svg%3E'">
                    <span>${timeA.nome}</span>
                </div>
                <div class="modal-vs">VS</div>
                <div class="modal-time">
                    <img src="${timeB.img}" alt="${timeB.nome}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23333%22/%3E%3Ctext x=%2240%22 y=%2245%22 text-anchor=%22middle%22 fill=%22%23ffd700%22 font-size=%2216%22 font-weight=%22bold%22%3E${timeB.nome.replace('CLÃ ', '')}%3C/text%3E%3C/svg%3E'">
                    <span>${timeB.nome}</span>
                </div>
            `;

            modalInfo.innerHTML = `
                <p>📅 00/26 - 23:00 BRT</p>
                <p>🏟️ Arena Gaming World</p>
                <p style="color:#ffd700; margin-top:8px;">Clique fora para fechar</p>
            `;

            modal.classList.add('mostrar');
        }

        document.querySelector('.fechar-modal').addEventListener('click', function() {
            document.getElementById('modal-confronto').classList.remove('mostrar');
        });

        document.getElementById('modal-confronto').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('mostrar');
            }
        });

        document.querySelectorAll('.btn-rodada').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.btn-rodada').forEach(b => b.classList.remove('ativo'));
                this.classList.add('ativo');
                const rodada = parseInt(this.dataset.rodada);
                renderizarRodada(rodada);
            });
        });

        renderizarRodada(1);
        console.log('✅ Campeonato carregado!');
    </script>
</body>
</html>
