<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming World - Campeonato</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #fff;
            position: relative;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 100, 0, 0.04) 0%, transparent 60%),
                linear-gradient(180deg, #0a0a0a 0%, #111 50%, #0a0a0a 100%);
            z-index: 0;
        }

        .bg-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('fundogaming.png') no-repeat center center/cover;
            opacity: 0.12;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-principal {
            width: 100%;
            max-width: 700px;
            margin-bottom: 30px;
            filter: drop-shadow(0 8px 40px rgba(255, 215, 0, 0.15));
            transition: transform 0.3s ease;
        }

        .logo-principal img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
        }

        .logo-principal:hover {
            transform: scale(1.02);
        }

        .titulo-campeonato {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 4s linear infinite;
            letter-spacing: 6px;
            margin-bottom: 10px;
            text-shadow: none;
        }

        @keyframes shineText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitulo-campeonato {
            font-size: 1.3rem;
            color: #ffd700;
            text-align: center;
            font-style: italic;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .card-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px 30px;
            width: 100%;
            max-width: 900px;
        }

        .card {
            flex: 1 1 280px;
            max-width: 380px;
            background: rgba(18, 18, 35, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 35px 25px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.1);
            transition: all 0.35s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 215, 0, 0.15);
            border-color: rgba(255, 215, 0, 0.25);
            background: rgba(25, 25, 45, 0.95);
        }

        .card .icone-card {
            margin-bottom: 12px;
        }

        /* AUMENTEI O TAMANHO DA IMAGEM AQUI */
        .card .icone-card img {
            width: 100px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.3));
            transition: transform 0.3s ease;
        }

        .card:hover .icone-card img {
            transform: scale(1.1) rotate(-5deg);
        }

        .card h2 {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f9e05d, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .card .card-sub {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .card .card-destaque {
            font-size: 0.9rem;
            background: rgba(255, 215, 0, 0.06);
            padding: 5px 14px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 215, 0, 0.08);
            color: #f5e7b0;
            margin: 8px 0 16px 0;
        }

        .card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #c8d0e6;
            margin: 10px 0 20px 0;
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 60px;
            text-decoration: none;
            color: #0a0a0a;
            background: linear-gradient(145deg, #f7d875, #f5b342);
            box-shadow: 0 6px 0 #b16f1a, 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.1s ease;
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, #fce38a, #f7b845);
            box-shadow: 0 8px 0 #a55f12, 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b16f1a, 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            padding: 20px 20px 25px;
            color: #666;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            width: 100%;
            border-top: 1px solid rgba(255, 215, 0, 0.05);
        }

        .footer p:last-child {
            color: #ffd700;
            font-weight: 600;
            margin-top: 6px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .logo-principal { max-width: 100%; }
            .titulo-campeonato { font-size: 2rem; letter-spacing: 3px; }
            .subtitulo-campeonato { font-size: 1rem; }
            .card { flex: 1 1 100%; max-width: 400px; }
            .card h2 { font-size: 1.7rem; }
            .btn { font-size: 1rem; padding: 12px 30px; }
            .card .icone-card img { width: 80px; }
        }

        @media (max-width: 480px) {
            .container { padding: 12px; }
            .logo-principal { max-width: 100%; }
            .titulo-campeonato { font-size: 1.5rem; letter-spacing: 2px; }
            .subtitulo-campeonato { font-size: 0.85rem; }
            .card { padding: 25px 18px 22px; }
            .card h2 { font-size: 1.4rem; }
            .card .icone-card img { width: 70px; }
            .card p { font-size: 0.85rem; }
            .btn { font-size: 0.9rem; padding: 11px 20px; }
            .footer { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="bg-overlay"></div>

<div class="container">
    <div class="logo-principal">
        <img src="logogaming.png" alt="Gaming World" onerror="this.style.display='none'">
    </div>

    <h1 class="titulo-campeonato">CAMPEONATO GAMING BATTLE 2026</h1>
    <p class="subtitulo-campeonato">"Aqui Gaming World 2026"</p>

    <div class="card-grid">
        <div class="card">
            <div class="icone-card">
                <img src="fotoc.png" alt="Espadas cruzadas">
            </div>
            <h2>2 VS 2</h2>
            <div class="card-sub">Mobile Legends</div>
            <div class="card-destaque">🏅 Dupla • Estratégia • Sincronia</div>
            <p>
                Mostre sua dupla dinâmica.<br>
                Partidas eletrizantes, premiação exclusiva.
                <!-- REMOVI O "ranking global" AQUI -->
            </p>
            <a href="campeonatoml.html" class="btn">⚔️ PARTICIPAR</a>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Gaming Battle - Todos os direitos reservados</p>
        <p>Gaming World E-SPORTS</p>
    </div>
</div>
</body>
</html>
